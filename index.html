<!doctype html>
<html>
  <head>
    <title>Student Information Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="card">
      <h1 id="studentName">Student Name</h1>

      <img id="studentImage" src="student.jpg" alt="Student Photo" />

      <h2>Student Details</h2>

      <p>Name: <span id="name"></span></p>

      <p>Course: <span id="course"></span></p>

      <p>University: <span id="university"></span></p>

      <p>Year: <span id="year"></span></p>

      <p>Student ID: <span id="studentId"></span></p>

      <p>Email: <span id="email"></span></p>

      <h2>About Me</h2>

      <p id="about">I am a student learning HTML, CSS and JavaScript.</p>

      <a id="profileLink" href="https://www.google.com" target="_blank">
        Visit My University
      </a>
    </div>

    <script src="script.js"></script>
  </body>
</html>
